name: daily-short

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOURCE_CHANNELS: ${{ vars.SOURCE_CHANNELS }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          CHANNEL_LANGUAGE: English
          TTS_VOICE: en-US-AriaNeural
          PRIVACY: public
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
        run: python main.py
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/used.json
          git commit -m "update state" || echo "nothing to commit"
          git push
